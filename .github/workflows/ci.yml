name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-tests:
    name: Simulator tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: simulator/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r simulator/requirements.txt

      - name: Run tests with coverage
        run: python -m pytest simulator/tests --cov=simulator --cov-report=term-missing --cov-report=xml

  validator-tests:
    name: Flink validator tests (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Run Maven tests
        working-directory: flink-jobs/telemetry-processor
        run: mvn -B test

  compose-smoke:
    name: Compose smoke test (TimescaleDB schema)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose --env-file .env config --quiet

      - name: Start broker and database
        run: docker compose --env-file .env up -d --wait rabbitmq timescaledb

      - name: Assert TimescaleDB hypertables exist
        run: |
          docker compose --env-file .env exec -T timescaledb \
            psql -v ON_ERROR_STOP=1 -U iot_user -d iot_data -tAc \
            "SELECT count(*) FROM timescaledb_information.hypertables
             WHERE hypertable_name IN ('raw_telemetry','aggregated_metrics','dlq_records');" \
            | grep -qx 3

      - name: Show container logs
        if: always()
        run: docker compose --env-file .env logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --env-file .env down -v --remove-orphans
